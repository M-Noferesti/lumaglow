<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">LumaGlow CEP preview</title>
  <desc id="desc">Illustration of a Photoshop glow effect beside the dark LumaGlow control panel.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11131f"/><stop offset="1" stop-color="#1c1729"/></linearGradient>
    <linearGradient id="purple"><stop stop-color="#bea5ff"/><stop offset="1" stop-color="#8160df"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#c6aaff" stop-opacity=".75"/><stop offset=".35" stop-color="#976ded" stop-opacity=".26"/><stop offset="1" stop-color="#976ded" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f4eaff" stroke-opacity=".06"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#05040a" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/><rect width="1200" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="582" cy="342" r="290" fill="url(#light)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="52" width="187" height="30" rx="15" fill="#302849" stroke="#6d579e"/>
    <circle cx="79" cy="67" r="4" fill="#a8e8d0"/><text x="92" y="72" fill="#d9c9ff" font-size="12" font-weight="700" letter-spacing="1.2">PHOTOSHOP · CEP</text>
    <text x="54" y="169" fill="#f5efff" font-size="78" font-weight="700" letter-spacing="-4">LumaGlow</text>
    <text x="59" y="219" fill="#c0b8d0" font-size="21">Shape the light. Keep the source.</text>
    <text x="60" y="260" fill="#8e8a9e" font-size="15">A layered glow panel with live controls and a calm,</text>
    <text x="60" y="285" fill="#8e8a9e" font-size="15">focused workflow for Photoshop.</text>
    <g transform="translate(60 512)" fill="#d6cbec" font-size="13" font-weight="700">
      <rect width="143" height="44" rx="12" fill="#29253a" stroke="#4a4060"/><text x="17" y="27">✦  3 blur passes</text>
      <rect x="154" width="140" height="44" rx="12" fill="#29253a" stroke="#4a4060"/><text x="171" y="27">◉  Live controls</text>
      <rect x="305" width="136" height="44" rx="12" fill="#29253a" stroke="#4a4060"/><text x="322" y="27">◇  Source safe</text>
    </g>
  </g>
  <circle cx="570" cy="378" r="118" fill="#ad8aff" opacity=".35" filter="url(#blur)"/>
  <circle cx="570" cy="378" r="52" fill="#d5c5ff" opacity=".6" filter="url(#blur)"/>
  <circle cx="570" cy="378" r="14" fill="#e6dcff"/><path d="M570 354l5 19 19 5-19 5-5 19-5-19-19-5 19-5z" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="810" y="34" width="334" height="532" rx="19" fill="#211f2c" stroke="#4d455e"/>
    <rect x="830" y="55" width="36" height="36" rx="10" fill="#45336e"/><text x="837" y="82" fill="#eadfff" font-size="27">✦</text>
    <text x="878" y="68" fill="#938fa4" font-size="9" font-weight="700" letter-spacing="1.6">PHOTOSHOP EXTENSION</text>
    <text x="878" y="89" fill="#f3edfb" font-size="18" font-weight="700">LumaGlow <tspan fill="#aa91df" font-size="11">CEP</tspan></text>
    <rect x="830" y="109" width="294" height="95" rx="12" fill="#1b1829" stroke="#403755"/>
    <circle cx="977" cy="155" r="50" fill="url(#light)"/><circle cx="977" cy="155" r="11" fill="#b99eff"/><text x="969" y="163" fill="#fff" font-size="22">✦</text>
    <text x="843" y="189" fill="#baa8ec" font-size="9" font-weight="700" letter-spacing="1.2">●  LIVE EDITING</text>
    <text x="830" y="232" fill="#8d899d" font-size="9" font-weight="700" letter-spacing="1.3">SOURCE</text>
    <text x="830" y="251" fill="#ece6f7" font-size="13" font-weight="700">Neon artwork</text>
    <rect x="830" y="267" width="294" height="205" rx="12" fill="#252330" stroke="#423d4f"/>
    <text x="846" y="292" fill="#f1eaf9" font-size="13" font-weight="700">Light</text><text x="1081" y="292" fill="#817d90" font-size="10">01 / 02</text>
    <g fill="#c5becf" font-size="11"><text x="846" y="320">Radius</text><text x="846" y="360">Intensity</text><text x="846" y="400">Threshold</text><text x="846" y="440">Spread</text></g>
    <g fill="#c6aaff" font-size="11" text-anchor="end"><text x="1108" y="320">42 px</text><text x="1108" y="360">120%</text><text x="1108" y="400">55%</text><text x="1108" y="440">50%</text></g>
    <g stroke="#4f495f" stroke-width="4" stroke-linecap="round"><path d="M846 335h261M846 375h261M846 415h261M846 455h261"/></g>
    <g stroke="#a98aee" stroke-width="4" stroke-linecap="round"><path d="M846 335h78M846 375h111M846 415h144M846 455h130"/></g>
    <g fill="#dfd2ff"><circle cx="924" cy="335" r="6"/><circle cx="957" cy="375" r="6"/><circle cx="990" cy="415" r="6"/><circle cx="976" cy="455" r="6"/></g>
    <rect x="830" y="486" width="294" height="47" rx="11" fill="#252330" stroke="#423d4f"/><text x="846" y="513" fill="#f1eaf9" font-size="12" font-weight="700">Color</text><circle cx="1066" cy="508" r="9" fill="#aa8dff"/><text x="1080" y="512" fill="#b9afcb" font-size="10">#AA8DFF</text>
    <rect x="830" y="542" width="294" height="20" rx="7" fill="url(#purple)"/><text x="977" y="556" text-anchor="middle" fill="#20152c" font-size="10" font-weight="700">CREATE GLOW ↗</text>
  </g>
</svg>
